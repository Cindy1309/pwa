<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Primal Echo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

   <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet">

    <style>

        :root{
            --primal-blue:#00d9ff;
            --primal-orange:#ff8c00;
            --primal-dark:#07111f;
            --primal-dark2:#0f172a;
        }

        body{

    background:
    linear-gradient(
        180deg,
        #020611 0%,
        #051120 35%,
        #07192d 50%,
        #051120 65%,
        #020611 100%
    );

    color:white;

    font-family:'Poppins',sans-serif;

    min-height:100vh;
}

        /* NAVBAR */

        .navbar{

    background:
    rgba(0,0,0,.60);

    backdrop-filter:blur(12px);

    border-bottom:
    1px solid rgba(123,212,255,.15);

    padding:18px 0;
}

        .navbar-brand{

    font-family:'Cinzel',serif;

    font-size:2rem;

    color:white !important;

    letter-spacing:4px;

    font-weight:600;
}
.btn-outline-info{

    border:
    1px solid rgba(123,212,255,.35);

    color:white;

    background:none;
}

.btn-outline-info:hover{

    background:
    rgba(123,212,255,.15);

    color:white;
}

.btn-warning{

    background:none;

    color:white;

    border:
    1px solid rgba(123,212,255,.35);
}

.btn-warning:hover{

    background:
    rgba(123,212,255,.15);

    color:white;
}

        .nav-link{

            color:white!important;

            font-size:1.1rem;

            transition:.3s;
        }

        .nav-link:hover{

            color:var(--primal-orange)!important;
        }

        /* CONTENIDO */

        .main-content{

            min-height:80vh;

            padding-top:120px;

            padding-bottom:60px;
        }

        /* TITULOS */

        h1,h2,h3{

            font-family:'Orbitron',sans-serif;

            color:var(--primal-blue);

            text-shadow:
                0 0 15px rgba(0,217,255,.5);
        }

        /* TARJETAS */

        .panel{

            background:
            linear-gradient(
                rgba(25,35,55,.95),
                rgba(15,25,40,.95)
            );

            border:
            1px solid rgba(0,217,255,.2);

            border-radius:25px;

            padding:30px;

            box-shadow:
            0 0 25px rgba(0,217,255,.08);
        }

        /* FOOTER */

        footer{

            border-top:
            1px solid rgba(0,217,255,.2);

            text-align:center;

            padding:25px;

            background:#05090f;
        }

        .user-buttons a{

            margin-left:10px;
        }
        /* LOGIN MODAL */

.modal-content{

    background:
    linear-gradient(
        180deg,
        rgba(2,8,20,.98),
        rgba(5,18,35,.98)
    ) !important;

    border:
    1px solid rgba(123,212,255,.20);

    border-radius:10px;

    color:white;

}

.modal-header{

    border-bottom:
    1px solid rgba(123,212,255,.15);

}

.modal-title{

    font-family:'Cinzel',serif;

    font-size:2rem;

    color:white;

}

.form-control{

    background:
    rgba(255,255,255,.03);

    border:
    1px solid rgba(123,212,255,.20);

    color:white;

}

.form-control:focus{

    background:
    rgba(255,255,255,.05);

    color:white;

    border-color:#7bd4ff;

    box-shadow:
    0 0 15px rgba(123,212,255,.25);

}

.form-control::placeholder{

    color:#93a8bb;

}

.login-btn{

    background:none;

    border:
    1px solid rgba(123,212,255,.35);

    color:white;

    letter-spacing:2px;

    text-transform:uppercase;

    transition:.3s;

}

.login-btn:hover{

    background:
    rgba(123,212,255,.15);

    color:white;

}

.login-help{

    color:#93a8bb;

    text-align:center;

    margin-top:15px;

}

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">

    <div class="container">

        <a class="navbar-brand"
           href="/app/">

            PRIMAL ECHO

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="menu">

            
            

    <div class="user-buttons ms-auto">

    <button
        class="btn btn-outline-info"
        data-bs-toggle="modal"
        data-bs-target="#loginModal">

        Iniciar sesión

    </button>

    <a href="#"
       class="btn btn-warning">

        Registrarse

    </a>

</div>

</div>
        </div>

    </div>

</nav>


<!-- CONTENIDO DINÁMICO -->

<div class="container main-content">

    {% block content %}
    {% endblock %}

</div>


<footer>

    MonsterByte Studios © 2026

</footer>
<!-- MODAL LOGIN -->

<div class="modal fade"
     id="loginModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content bg-dark text-white">

            <div class="modal-header">

                <h5 class="modal-title">

                    Iniciar Sesión

                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form
                    method="POST"
                    action="/app/login/">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label>

                            Usuario

                        </label>

                        <input
                            type="text"
                            name="usuario"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>

                            Contraseña

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <button
    type="submit"
    class="btn login-btn w-100">

    ACCEDER

</button>

                </form>

                <hr>

                <div class="login-help">

    Usuario de prueba:
    <strong>admin</strong>

    <br>

    Contraseña:
    <strong>1234</strong>

</div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
